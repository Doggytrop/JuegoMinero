<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Veta Sonora: El Corazón de la Sierra</title>
  <meta name="description" content="Juego web indie minimalista de minería hecho en JavaScript puro.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%237a4a2a%22/><rect x=%224%22 y=%225%22 width=%224%22 height=%224%22 fill=%22%23ffd23f%22/><rect x=%229%22 y=%229%22 width=%223%22 height=%223%22 fill=%22%23e07a3a%22/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="wrap">
      <canvas id="game" width="480" height="270" aria-label="Juego Veta Sonora"></canvas>
      <div id="touch" aria-hidden="true">
        <div class="dpad">
          <button data-key="up" class="u">▲</button>
          <button data-key="left" class="l">◀</button>
          <button data-key="right" class="r">▶</button>
          <button data-key="down" class="d">▼</button>
        </div>
        <div class="actions">
          <button data-action="dyn" title="Dinamita">💥</button>
          <button data-action="radio" title="Radio">📻</button>
          <button data-action="ok" title="Aceptar / Tienda">OK</button>
          <button data-action="pause" title="Pausa">II</button>
        </div>
      </div>
    </div>
    <p class="help">Flechas/WASD: mover, excavar y subir · Espacio: dinamita · E: radio · Enter: tienda · P: pausa · M/N: sonido/música · Tab: minimapa · B: bloom · G: debug</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
